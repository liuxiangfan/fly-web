<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- 机架 X 形臂 -->
  <g stroke="#31435f" stroke-width="3.4" stroke-linecap="round">
    <path d="M32 32 L18.5 18.5"/>
    <path d="M32 32 L45.5 18.5"/>
    <path d="M32 32 L18.5 45.5"/>
    <path d="M32 32 L45.5 45.5"/>
  </g>
  <!-- 四个旋翼环（四色，对应曲线系列） -->
  <g fill="none" stroke-width="2.6">
    <circle cx="17" cy="17" r="6.5" stroke="#22d3ee"/>
    <circle cx="47" cy="17" r="6.5" stroke="#7ee787"/>
    <circle cx="17" cy="47" r="6.5" stroke="#fbbf24"/>
    <circle cx="47" cy="47" r="6.5" stroke="#f85149"/>
  </g>
  <!-- 机头向量：由中心指向右上，表示当前姿态 -->
  <path d="M32 32 L41.5 24.5" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4.2" fill="#eef2f8"/>
  <circle cx="32" cy="32" r="1.8" fill="#0b1220"/>
</svg>
