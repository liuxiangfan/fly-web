name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch: {} # 允许在 GitHub 网页上手动触发

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Selftest + Scenecheck (50 checks)
        run: npm run check

      - name: Build
        run: npm run build

      # 本项目是纯静态资产（wrangler.jsonc 只配 assets），需要 wrangler v4；
      # wrangler-action@v3 默认安装的 v3.x 不认 assets-only 配置，故显式安装
      - name: Install Wrangler v4
        run: npm install --no-save wrangler@4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: 4
