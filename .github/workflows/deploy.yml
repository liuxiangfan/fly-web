name: Deploy to Cloudflare Workers

# 只跑 Windows（本阶段只支持 Windows 本机）。verify 与 deploy 都在 windows-latest 上执行；
# 浏览器用例走仓库自己的驱动器（自带 preview 与就绪等待），不依赖 shell 语法。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {} # 允许在 GitHub 网页上手动触发

permissions:
  contents: read
  deployments: write

jobs:
  # 先跑「不依赖部署凭据」的全部检查；只有它通过才部署。
  # 这样 PR 与 push 走同一条验证链，部署步骤也不会把时间浪费在必然失败的提交上。
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 证据索引的历史引用（git:<path>@<sha>）需要完整历史才能核对；浅克隆会明确判失败
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Selftest + Scenecheck + HTML contract
        run: npm run check

      # 文档基准的**只读复算**：用生成器的同一份实现重算全部记录，与存档逐字段比对。
      # 复核结论：CI 此前只有「引用存在 + 数值范围」检查，存档与实现可以悄悄脱钩；
      # 这一步把"文档里的定量结论"钉在可复算的证据上（约 8 s）。
      - name: Docbench recompute
        run: npx tsx scripts/doccheck.ts --recompute

      - name: Build
        run: npm run build

      # 产物体积预算：一次误 import 就能让产物多背一兆多的字体（本项目踩过），
      # 而体积不会自己报警，所以让 CI 报警。
      - name: Dist budget
        run: npm run budget

      # 说明：**完整的 107 项浏览器套件不放在部署闸门里**。
      # 原因（本轮实测）：windows-latest 只有 2 vCPU，软件 WebGL 下"同一个浏览器进程开第二个 WebGL 页面"
      # 可以超过 180 s——这不是产品缺陷，是容量；把它当部署闸门会让每次部署都红，红灯就失去意义。
      # 部署闸门用：静态门禁（tsc/check/docbench/build/budget）+ **部署后对线上产物的端到端 smoke**
      # （下面 deploy 作业里那一步，它验的是"这份提交真的部署上去了、核心功能活着"）。
      # 完整套件仍在 ci.yml（PR/分支）与"部署后 smoke-suite 作业"里跑，结果如实记录、不静默通过。

  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 本项目是纯静态资产（wrangler.jsonc 只配 assets），需要 wrangler v4；
      # wrangler-action@v3 默认安装的 v3.x 不认 assets-only 配置，故显式安装
      - name: Install Wrangler v4
        run: npm install --no-save wrangler@4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: 4

      # 部署后 smoke（**自动**）：把「线上到底跑的是哪个提交、核心功能是否还活着」变成每次部署
      # 都会产生的证据，而不是事后手工跑一次（复核 P2：证据要么自动产生，要么不会产生）。
      # 判定：HTTP 200 / 页面自报的构建标识等于本次提交 / 时钟真的在推进 / 5 行评测 / canvas /
      # 控制台零错误——任一不过即判这次部署失败（可见，而不是静默放过）。
      - name: Post-deploy smoke
        # 这一步用 bash（windows-latest 预装 Git Bash）：重试循环与变量都是 shell 逻辑，
        # 显式声明比依赖 runner 的默认 shell（PowerShell）更不容易踩平台差异。
        shell: bash
        env:
          # windows-latest 预装 Chrome；脚本的候选表已含该路径。
          CHROME_PATH: C:/Program Files/Google/Chrome/Application/chrome.exe
        run: |
          URL="https://fly_web.070616.xyz/"
          OUT=".audit-smoke/postdeploy-${{ github.sha }}.json"
          # CDN 传播可能有几秒延迟：重试 3 次、间隔 20 s，三次都不过才判失败。
          for i in 1 2 3; do
            if node scripts/postdeploy-smoke.mjs --url="$URL" --expect="${{ github.sha }}" --out="$OUT"; then
              echo "部署后 smoke 通过（第 $i 次）"
              exit 0
            fi
            echo "第 $i 次未通过（可能是 CDN 传播延迟），20 s 后重试"
            sleep 20
          done
          echo "部署后 smoke 连续 3 次失败——线上产物与本次提交不一致，或核心功能已损坏"
          exit 1

      - name: Upload post-deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postdeploy-evidence
          path: .audit-smoke/postdeploy-*.json
          if-no-files-found: ignore

  # 完整浏览器套件（107 项）：**部署后**跑，结果如实记录，但**不阻断部署**。
  # 判定口径由 scripts/smoke-verdict.mjs 给出（assert / incomplete / env / unknown）；
  # 只有"有用例级失败"才算产品问题——那类失败仍然会让这个作业红（可见），
  # 而纯容量失败（2 vCPU 开不出第二个 WebGL 页面）在摘要里标 env 并附现场。
  smoke-suite:
    needs: verify
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Browser smoke（完整集合，一轮）
        env:
          CHROME_PATH: C:/Program Files/Google/Chrome/Application/chrome.exe
          SMOKE_VIEWPORT: 800x600
          SMOKE_SLOW: "1"
        run: node scripts/ci-run-smoke.mjs --shard=both --runs=1 --out=.audit-smoke/suite
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-suite-logs
          path: .audit-smoke/suite
          if-no-files-found: ignore
