name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch: {} # 允许在 GitHub 网页上手动触发

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Selftest (37 checks)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        # PROVIDER 选择：官方 wrangler-action 需要 CLOUDFLARE_API_TOKEN secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
